# ==============================================================================
# Daily Tech Trend Intelligence - Trend Scoring & Classification Engine
# ==============================================================================

version: "1.0"

# ------------------------------------------------------------------------------
# 100-Point Mathematical Trend Score Formula
# ------------------------------------------------------------------------------
weights:
  recency: 15                  # Published/broken within 24h=15, 3d=10, 7d=5, >7d=2
  cross_platform_mentions: 15  # Mentions across independent domains (>=4 sources=15, 3=11, 2=7, 1=3)
  growth_velocity: 15          # Rate of expansion (stars/hr, tweets/min, view velocity)
  developer_interest: 10       # Active developer comments, technical critiques, benchmarks
  search_momentum: 10          # Google Trends breakout, spike in search query volume
  github_momentum: 10          # Star velocity, forks, issues, PRs, implementation repos
  social_engagement: 5         # Likes, retweets, bookmarks, Reddit upvotes
  official_confirmation: 5     # Backed by official engineering blog/repo/documentation
  real_world_adoption: 5       # Production deployment, actual code integrated, not toy demo
  business_impact: 5           # Monetization potential, enterprise budget allocation

total_max_score: 100

# ------------------------------------------------------------------------------
# Qualitative Fine-Tuning Multipliers
# ------------------------------------------------------------------------------
qualitative_modifiers:
  core_area_multiplier:
    ai_automation: 1.15
    telegram_bots: 1.15
    web_development: 1.15
    priority_2_areas: 1.05
    priority_3_areas: 0.95

  reproducibility_bonus: 5      # Code is open-source, reproducible benchmark
  security_critical_bonus: 10   # Zero-day, prompt-injection CVE, critical patch

# ------------------------------------------------------------------------------
# Hype vs Practical Value Evaluation
# ------------------------------------------------------------------------------
hype_evaluation:
  hype_indicators:
    - "mind-blowing / game changer / kills / RIP X" in title
    - Non-reproducible benchmarks or cherry-picked closed evals
    - Zero documentation, closed repo, waitlist-only marketing
    - High Twitter retweets with zero GitHub commits or code commits
    - Heavy crypto/token incentive without technical substrate
  practical_indicators:
    - Clean API documentation, quickstart, working pip/npm package
    - Clear architectural trade-offs discussed by author
    - Working production use case or concrete integration
    - Reproducible test suite and MIT/Apache-2.0 license
    - Solves real friction point (e.g. latency, context limit, auth)

# ------------------------------------------------------------------------------
# Trend Type Classification Rules
# ------------------------------------------------------------------------------
classifications:
  exploding:
    badge: "🔥 Exploding"
    description: "Sudden violent surge in activity within 24 hours across multiple platforms."
    min_score: 88
    min_velocity_score: 13
    max_age_days: 2

  rising:
    badge: "🚀 Rising"
    description: "Steady, strong acceleration with continuous upward trajectory over 3-7 days."
    min_score: 75
    min_velocity_score: 9

  emerging:
    badge: "👀 Emerging"
    description: "Early signals detected; not mainstream yet, high potential value for early adopters."
    min_score: 65
    min_recency_score: 12
    max_mainstream_saturation: 40

  important:
    badge: "🧠 Important"
    description: "High technical significance and architecture shift; not necessarily viral on social media."
    min_score: 70
    min_developer_interest: 8
    min_official_confirmation: 4

  industry_shift:
    badge: "🏢 Industry Shift"
    description: "Fundamental paradigm change impacting enterprise budgets, hiring, or standards."
    min_score: 80
    min_business_impact: 4

  developer_opportunity:
    badge: "🛠 Developer Opportunity"
    description: "Immediate actionable wedge for developers to build bots, apps, SaaS, or monetization."
    min_score: 72
    min_real_world_adoption: 4

  security_alert:
    badge: "⚠️ Security Alert"
    description: "Critical vulnerability, prompt injection, compromised package, or compliance urgent item."
    override_priority: true
    requires_instant_flag: true

  fading:
    badge: "📉 Fading"
    description: "Previously trending topic experiencing deceleration or proven to be transient hype."
    negative_momentum_threshold: -10
